# Switches the SR-IOV Network Operator from "daemon" mode to "systemd" mode.
#
# In daemon mode the operator configures nodes at runtime via a privileged pod.
# In systemd mode it writes sriov-config.service and sriov-config-post-network.service
# unit files to the host. These run at each boot — before OVS starts — which is
# the prerequisite for OVS-DOCA hardware offloading (doca-init=true).
#
# What will happen when you apply this:
#   1. The SR-IOV operator daemon writes sriov-config.service to both dell-h200-2
#      and dell-h200-3 via MachineConfig.
#   2. MCO drains each node and reboots it to apply the new systemd units.
#   3. On next boot: sriov-config (pre-phase) runs before OVS, setting switchdev
#      and VFs. Then OVS starts with hw-offload=true and DOCA initializes.
#      Then sriov-config-post-network (post-phase) recreates the per-rail OVS
#      bridges (br-0000_18_00.0 etc.) before kubelet starts.
#
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovOperatorConfig
metadata:
  name: default
  namespace: openshift-sriov-network-operator
spec:
  configDaemonNodeSelector:
    feature.node.kubernetes.io/pci-15b3.sriov.capable: "true"
    network.nvidia.com/operator.mofed.wait: "false"
    node-role.kubernetes.io/worker: ""
  enableInjector: true
  enableOperatorWebhook: true
  configurationMode: "systemd"
  featureGates:
    manageSoftwareBridges: true
  logLevel: 2