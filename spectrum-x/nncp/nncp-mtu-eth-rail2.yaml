apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: nncp-mtu-eth-rail2
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ''
  desiredState:
    interfaces:
    - name: eth_rail2
      description: mtu 9216 eth_rail2
      type: ethernet 
      state: up 
      mtu: 9216