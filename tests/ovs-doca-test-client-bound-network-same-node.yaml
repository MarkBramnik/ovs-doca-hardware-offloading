# Client job for OVN-aware hardware offload, same-node test.
#
# nodeSelector keeps test-server so the job lands on nvd-srv-30 (same node as
# the server pod), exercising the same-node DOCA hardware offload path where
# traffic goes VF0_rep <-> br-int <-> VF1_rep entirely in CX7 silicon.
apiVersion: batch/v1
kind: Job
metadata:
  name: ovs-doca-test-client
  labels:
    app: ovs-doca-test-client
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ovs-doca-test-client
      annotations:
        v1.multus-cni.io/default-network: default/cx7-ovn-hw-offload
    spec:
      nodeSelector:
        node-role.kubernetes.io/test-server: ""   # same node as server = nvd-srv-30
      restartPolicy: "Never"
      containers:
      - name: python-client
        image: quay.io/rh-ee-mbramnik/ecosys-nvidia/ovs-doca-test-app-client:latest
        imagePullPolicy: Always
        resources:
          limits:
            openshift.io/mlnx_cx7_vf: "1"
        env:
        - name: SERVER_HOST
          value: "ovs-doca-test-server-service"
        - name: SERVER_PORT
          value: "8000"
        - name: CALLS
          value: "600"
        - name: CALL_FREQUENCY_SECONDS
          value: "1"
