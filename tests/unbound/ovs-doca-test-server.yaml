apiVersion: apps/v1
kind: Deployment
metadata:
  name: ovs-doca-test-server
  labels:
    app: ovs-doca-test-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ovs-doca-test-server
  template:
    metadata:
      labels:
        app: ovs-doca-test-server
    spec:
      nodeSelector:
        node-role.kubernetes.io/test-server: ""
      containers:
      - name: python-server
        image: quay.io/rh-ee-mbramnik/ecosys-nvidia/ovs-doca-test-app-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: ovs-doca-test-server-service
  labels:
    app: ovs-doca-test-server
spec:
  type: ClusterIP
  selector:
    app: ovs-doca-test-server
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000